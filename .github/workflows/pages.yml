name: Deploy to GitHub Pages

# Builds the browser-only version (Python runs in the browser via Pyodide,
# the AI model via onnxruntime-web) and publishes it to
# https://insofury.github.io/pixelpal/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The build downloads the u2netp model (checked by SHA-256); keep it between runs.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: u2netp-309c8469
      - name: Build static site
        run: python scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
